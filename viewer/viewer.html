<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHD 3D Viewer</title>
<!--
  Viewer for the glTF (.glb) files written by mag3d (three.js).
  Usage:
    1) open this file in a browser and choose .glb files with "Open files" (several files = time animation)
       or drag & drop .glb files onto the window
    2) via an http server, give them in the URL: viewer.html?files=demo_001.glb,demo_002.glb
       (e.g. in the directory of the .glb files:  python3 -m http.server 8000)
  three.js is loaded from a CDN (jsdelivr), so an internet connection is needed.
  For offline use, keep three.js 0.170.0 locally and change the paths in the importmap below.
-->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg: #000; --panel: rgba(20,24,32,.88); --fg: #e8eaf0; --muted: #9aa3b5; --acc: #6aa8ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 10px; left: 10px; width: 250px; max-height: calc(100% - 20px); overflow: auto;
           background: var(--panel); border-radius: 8px; padding: 10px 12px; box-sizing: border-box; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel h2 { font-size: 12px; margin: 10px 0 4px; color: var(--muted); font-weight: 600; }
  #panel label { display: flex; align-items: center; gap: 6px; margin: 2px 0; cursor: pointer; }
  button { background: #2a3142; color: var(--fg); border: 1px solid #3c4559; border-radius: 5px;
           padding: 3px 8px; margin: 2px 2px 2px 0; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--acc); }
  input[type=range] { width: 100%; }
  #title { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 16px;
           text-shadow: 0 0 4px #000; pointer-events: none; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
          background: rgba(40,80,160,.35); font-size: 20px; pointer-events: none; }
  .lab { color: #fff; font-size: 12px; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; }
  #hide { position: fixed; top: 10px; left: 266px; }
  #legend { position: fixed; right: 10px; bottom: 10px; pointer-events: none; }
  .selrow { margin: 4px 0 8px; }
  .selrow .v { color: var(--muted); }
  @media (max-width: 600px) { #panel { width: calc(100% - 20px); max-height: 45%; } #hide { left: auto; right: 10px; } }
</style>
</head>
<body>
<div id="view"></div>
<canvas id="legend" width="10" height="10"></canvas>
<div id="title"></div>
<div id="drop">Drop .glb files here</div>
<button id="hide">≡</button>
<div id="panel">
  <h1>MHD 3D Viewer</h1>
  <input type="file" id="file" accept=".glb,.gltf" multiple style="display:none">
  <button id="open">Open files</button>
  <div id="status" style="color:var(--muted)">Open .glb files</div>

  <div id="timebox" style="display:none">
    <h2>Time</h2>
    <input type="range" id="time" min="0" max="0" value="0">
    <div><button id="play">▶ Play</button> <span id="tname"></span></div>
    <label>Speed <input type="range" id="fps" min="1" max="20" value="4" style="width:100px"> <span id="fpsv">4</span> fps</label>
  </div>

  <h2>Layers</h2>
  <div id="layers"></div>

  <div id="selbox" style="display:none">
    <h2>Selectable slices (choose the plane shown)</h2>
    <div id="sels"></div>
  </div>

  <h2>Opacity</h2>
  <label>Slices <input type="range" id="opPlane" min="0" max="1" step="0.05" value="1"></label>
  <label>Stacks <input type="range" id="opStack" min="0" max="1" step="0.05" value="1"></label>
  <div style="color:var(--muted);font-size:11px">"Slices" also applies to stacks (stacks = Slices x Stacks)</div>
  <label>Isosurfaces <input type="range" id="opIso" min="0" max="1" step="0.05" value="1"></label>

  <h2>View</h2>
  <button data-view="sun">From the Sun</button><button data-view="tail">From the tail</button>
  <button data-view="dusk">From dusk</button><button data-view="north">From north</button>
  <button data-view="oblique">Oblique</button>
  <h2>Other</h2>
  <label><input type="checkbox" id="labels" checked> Labels</label>
  <label><input type="checkbox" id="legendcb" checked> Colour bars</label>
  <label><input type="checkbox" id="whitebg"> White background</label>
  <button id="shot">Save image (PNG)</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
view.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
let bgColor = new THREE.Color(0, 0, 0);
scene.background = bgColor;
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 20000);
camera.position.set(-140, 90, 170);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-1, 0.6, 0.3);   // Sun = display +X (glTF +X)
camera.add(sun); scene.add(camera);

let frames = [];          // [{name, root, labels:[CSS2DObject]}]
let cur = -1;
const layerState = {};    // group name -> visible
const status = document.getElementById('status');

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

function groupOf(name) {
  const st = name.match(/^stack(\d+)_([a-z]{2})_/);
  if (st) return `stack${st[1]} (stacked slices ${st[2]})`;
  if (name.startsWith('stack_')) return 'stack (stacked slices)';
  if (name.startsWith('colorbar')) return 'colorbar (3D)';
  const m = name.match(/^(sel\d+)_/);
  if (m) return m[1] + ' (selectable slices)';
  return name;
}
const selState = {};      // 'sel1' -> {idx, all, n, axis, pos:[]}

function buildLayers() {
  const box = document.getElementById('layers');
  box.innerHTML = '';
  const names = new Set();
  for (const f of frames) f.root.traverse(o => { if (o.isMesh || o.isLine || o.isLineSegments) names.add(groupOf(nodeName(o))); });
  for (const n of [...names].sort()) {
    if (!(n in layerState)) layerState[n] = true;
    const lab = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = layerState[n];
    cb.onchange = () => { layerState[n] = cb.checked; applyVisibility(); };
    lab.append(cb, document.createTextNode(' ' + n));
    box.appendChild(lab);
  }
  buildSelectors();
}

// selectable slices: node extras {group, index, n, axis, pos}
function buildSelectors() {
  const info = {};
  for (const f of frames) f.root.traverse(o => {
    const u = o.userData || {};
    if (u.group === undefined || u.index === undefined) return;
    const g = info[u.group] || (info[u.group] = { n: u.n || 0, axis: u.axis || '', pos: [] });
    g.pos[u.index] = u.pos; g.n = Math.max(g.n, u.index + 1);
  });
  const box = document.getElementById('sels'); box.innerHTML = '';
  const names = Object.keys(info).sort();
  document.getElementById('selbox').style.display = names.length ? '' : 'none';
  for (const g of names) {
    const st = selState[g] || (selState[g] = { idx: Math.floor((info[g].n - 1) / 2), all: false });
    Object.assign(st, info[g]);
    const row = document.createElement('div'); row.className = 'selrow';
    const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = st.n - 1; sl.value = st.idx;
    const txt = document.createElement('div'); txt.className = 'v';
    const all = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = st.all;
    all.append(cb, document.createTextNode(' Show all'));
    const upd = () => {
      const p = st.pos[st.idx];
      txt.textContent = `${g}: ${st.axis} = ${p === undefined ? '?' : (+p).toFixed(1)}  (${st.idx + 1}/${st.n})`;
    };
    sl.oninput = () => { st.idx = +sl.value; upd(); applyVisibility(); };
    cb.onchange = () => { st.all = cb.checked; applyVisibility(); };
    upd();
    row.append(txt, sl, all); box.appendChild(row);
  }
}

function nodeName(o) {
  // GLTFLoader: a mesh with one primitive becomes a Mesh/LineSegments with the node name
  return o.name || (o.parent && o.parent.name) || '';
}

function applyVisibility() {
  const opP = +document.getElementById('opPlane').value;
  const opI = +document.getElementById('opIso').value;
  const opS = +document.getElementById('opStack').value;
  for (const f of frames) {
    f.root.traverse(o => {
      if (!(o.isMesh || o.isLine || o.isLineSegments)) return;
      const g = groupOf(nodeName(o));
      o.visible = layerState[g] !== false;
      const u = o.userData || {};
      if (u.group !== undefined && selState[u.group] && !selState[u.group].all)
        o.visible = o.visible && u.index === selState[u.group].idx;
      const m = o.material;
      if (!m) return;
      if (m.userData.baseOpacity === undefined) m.userData.baseOpacity = m.opacity;
      const n = nodeName(o);
      if (n.startsWith('plane') || n.startsWith('stack') || /^sel\d+_/.test(n)) {
        m.transparent = true; m.depthWrite = false;
        m.opacity = m.userData.baseOpacity * opP * (n.startsWith('stack') ? opS : 1);
      }
      if (n.startsWith('iso')) { m.transparent = true; m.opacity = m.userData.baseOpacity * opI; m.depthWrite = opI > 0.99; }
    });
  }
  const showLab = document.getElementById('labels').checked;
  frames.forEach((f, i) => f.labels.forEach(l => l.visible = showLab && i === cur));
  drawLegends();
}

// ---- colour bars (scenes[0].extras.legends), drawn only while a layer whose name starts with target is visible
function visibleTargets(f) {
  const vis = [];
  f.root.traverse(o => { if ((o.isMesh || o.isLine || o.isLineSegments) && o.visible) vis.push(nodeName(o)); });
  return vis;
}
function drawLegends() {
  const cv = document.getElementById('legend');
  const ctx = cv.getContext('2d');
  const f = frames[cur];
  const on = document.getElementById('legendcb').checked;
  const legs0 = (f && on) ? (f.legends || []).filter(L => visibleTargets(f).some(n => n.startsWith(L.target))) : [];
  // merge colour bars of the same quantity and range
  const seen = new Set(), legs = legs0.filter(L => {
    const k = L.label + '|' + L.vmin + '|' + L.vmax + '|' + JSON.stringify(L.colors[16]);
    if (seen.has(k)) return false; seen.add(k); return true;
  });
  const dpr = window.devicePixelRatio || 1, W = 240, rowH = 52;
  cv.style.width = W + 'px'; cv.style.height = Math.max(1, legs.length * rowH) + 'px';
  cv.width = W * dpr; cv.height = Math.max(1, legs.length * rowH) * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawLegendsTo(ctx, legs, 0, 0, W, rowH);
}
function drawLegendsTo(ctx, legs, x0, y0, W, rowH) {
  const white = document.getElementById('whitebg').checked;
  const fg = white ? '#000' : '#fff';
  legs.forEach((L, k) => {
    const y = y0 + k * rowH;
    ctx.fillStyle = white ? 'rgba(255,255,255,.75)' : 'rgba(0,0,0,.45)';
    ctx.fillRect(x0, y, W, rowH - 4);
    ctx.font = '12px system-ui, sans-serif'; ctx.fillStyle = fg; ctx.textBaseline = 'top';
    ctx.fillText(L.label, x0 + 8, y + 4, W - 16);
    const bx = x0 + 8, bw = W - 16, by = y + 20, bh = 12;
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    L.colors.forEach((c, i) => g.addColorStop(i / (L.colors.length - 1), `rgb(${c[0]},${c[1]},${c[2]})`));
    ctx.fillStyle = g; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = fg; ctx.lineWidth = 0.5; ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = fg; ctx.font = '11px system-ui, sans-serif';
    const fmt = v => (Math.abs(v) >= 1e4 || (Math.abs(v) < 1e-2 && v !== 0)) ? v.toExponential(2) : (+v.toPrecision(4)).toString();
    ctx.textAlign = 'left';  ctx.fillText(fmt(L.vmin), bx, by + bh + 2);
    ctx.textAlign = 'right'; ctx.fillText(fmt(L.vmax), bx + bw, by + bh + 2);
    ctx.textAlign = 'left';
  });
}

function show(i) {
  if (!frames.length) return;
  cur = Math.max(0, Math.min(frames.length - 1, i));
  frames.forEach((f, k) => { f.root.visible = (k === cur); });
  document.getElementById('time').value = cur;
  document.getElementById('tname').textContent = `${cur + 1}/${frames.length}  ${frames[cur].name}`;
  document.getElementById('title').textContent = frames[cur].title || '';
  applyVisibility();
}

async function loadAll(items) {   // items: [{name, url}] or [{name, buffer}]
  const loader = new GLTFLoader();
  for (const f of frames) { scene.remove(f.root); f.labels.forEach(l => l.removeFromParent()); }
  frames = [];
  items.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  let k = 0;
  for (const it of items) {
    status.textContent = `Loading ${++k}/${items.length}: ${it.name}`;
    const gltf = it.buffer ? await loader.parseAsync(it.buffer, '') : await loader.loadAsync(it.url);
    const root = gltf.scene;
    const ex = (gltf.parser.json.scenes?.[0]?.extras) || {};
    const labels = [];
    for (const L of (ex.labels || [])) {
      if (L.text === ex.title) continue;      // the title is shown at the top of the screen
      const div = document.createElement('div'); div.className = 'lab'; div.textContent = L.text;
      if (L.color) div.style.color = `rgb(${L.color.map(c => Math.round(c * 255)).join(',')})`;
      const o = new CSS2DObject(div); o.position.set(...L.p); root.add(o); labels.push(o);
    }
    if (ex.background) { bgColor = new THREE.Color(...ex.background); if (!document.getElementById('whitebg').checked) scene.background = bgColor; }
    scene.add(root);
    frames.push({ name: it.name, root, labels, title: ex.title || '', legends: ex.legends || [] });
  }
  const tb = document.getElementById('timebox');
  tb.style.display = frames.length > 1 ? '' : 'none';
  document.getElementById('time').max = frames.length - 1;
  buildLayers();
  show(0);
  status.textContent = `${frames.length} file(s)`;
  if (frames.length) fitView();
}

function fitView() {
  const box = new THREE.Box3().setFromObject(frames[cur].root);
  const size = box.getSize(new THREE.Vector3()).length();
  controls.target.set(0, 0, 0);
  camera.near = size / 1000; camera.far = size * 20; camera.updateProjectionMatrix();
  setView('oblique', size);
}

let sceneSize = 300;
function setView(v, size) {
  if (size) sceneSize = size;
  const d = sceneSize * 1.25;
  const pos = { sun: [d, 0, 0], tail: [-d, 0, 0], dusk: [0, 0, -d], north: [-d * 0.01, d, 0],
                oblique: [0.55 * d, 0.45 * d, -0.6 * d] }[v];
  camera.position.set(...pos); controls.target.set(0, 0, 0); controls.update();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));

// ---- files
document.getElementById('open').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async e => {
  const fs = [...e.target.files];
  await loadAll(await Promise.all(fs.map(async f => ({ name: f.name, buffer: await f.arrayBuffer() }))));
};
const drop = document.getElementById('drop');
window.addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; });
window.addEventListener('dragleave', e => { if (e.target === document.documentElement || e.clientX === 0) drop.style.display = 'none'; });
window.addEventListener('drop', async e => {
  e.preventDefault(); drop.style.display = 'none';
  const fs = [...e.dataTransfer.files].filter(f => /\.gl(b|tf)$/i.test(f.name));
  if (fs.length) await loadAll(await Promise.all(fs.map(async f => ({ name: f.name, buffer: await f.arrayBuffer() }))));
});
const q = new URLSearchParams(location.search).get('files');
if (q) loadAll(q.split(',').map(s => ({ name: s.split('/').pop(), url: s }))).catch(err => status.textContent = 'Loading failed: ' + err);

// ---- time animation
let playing = false, last = 0;
document.getElementById('time').oninput = e => show(+e.target.value);
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? '❚❚ Stop' : '▶ Play'; };
document.getElementById('fps').oninput = e => document.getElementById('fpsv').textContent = e.target.value;

// ---- misc
document.getElementById('opPlane').oninput = applyVisibility;
document.getElementById('opIso').oninput = applyVisibility;
document.getElementById('opStack').oninput = applyVisibility;
document.getElementById('labels').onchange = applyVisibility;
document.getElementById('legendcb').onchange = applyVisibility;
document.getElementById('whitebg').onchange = e => {
  scene.background = e.target.checked ? new THREE.Color(1, 1, 1) : bgColor;
  document.querySelectorAll('.lab').forEach(d => d.style.textShadow = e.target.checked ? 'none' : '');
  drawLegends();
};
document.getElementById('shot').onclick = () => {
  renderer.render(scene, camera);
  // 3-D view + colour bars in one image
  const src = renderer.domElement, c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const ctx = c.getContext('2d'); ctx.drawImage(src, 0, 0);
  const lg = document.getElementById('legend');
  if (lg.width > 1) ctx.drawImage(lg, c.width - lg.width - 10 * (window.devicePixelRatio || 1),
                                       c.height - lg.height - 10 * (window.devicePixelRatio || 1));
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = (frames[cur]?.name || 'view').replace(/\.glb$/, '') + '.png'; a.click();
};
document.getElementById('hide').onclick = () => {
  const p = document.getElementById('panel'); p.style.display = p.style.display === 'none' ? '' : 'none';
};

renderer.setAnimationLoop(t => {
  if (playing && frames.length > 1 && t - last > 1000 / +document.getElementById('fps').value) {
    last = t; show((cur + 1) % frames.length);
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
window.__viewer = { loadAll, setView, show, get frames() { return frames; } };
</script>
</body>
</html>
